<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<title>Logs</title>

<style>
body{
    font-family: Arial;
    padding: 20px;
}

h2{
    margin-bottom: 10px;
}

.controls{
    margin-bottom: 15px;
}

input, select, button{
    padding: 6px;
    margin-right: 8px;
}

table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th, td{
    border: 1px solid #333;
    padding: 6px;
    vertical-align: top;
}

th{
    background: #3f69b1;
    color: white;
}

tr:nth-child(even){
    background: #f5f5f5;
}

.badge{
    padding: 2px 6px;
    border-radius: 4px;
    color: white;
    font-size: 11px;
}

.ADD{ background: #2e7d32; }
.UPDATE{ background: #f9a825; }
.DELETE{ background: #c62828; }
</style>
</head>

<body>

<h2>Последни измени во распоредот</h2>

<div class="controls">

<select id="actionFilter">
    <option value="">Сите</option>
    <option value="ADD">Додадено</option>
    <option value="UPDATE">Изменето</option>
    <option value="DELETE">Избришано</option>
</select>

<button onclick="loadLogs()">Reload</button>
<label>Датум на термин:</label>
<input type="date" id="eventDateFilter">
<button id="clearEventFilter">Clear</button>
</div>

<div class="controls" id="pagination">
    <button id="prevPage" disabled>← Претходна</button>
    <span id="pageInfo">Страна 1</span>
    <button id="nextPage" disabled>Следна →</button>
</div>

<table>
<thead>
<tr>
    <th>Измена</th>
    <th>Датум на измена</th>
    <th>Датум</th>
    <th>Час</th>
    <th>Локација</th>
    <th>Предмет</th>
    <th>Професор</th>
    <th>Тип на настава</th>
    <th>Групи</th>
    <th>Коментар</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

<script type="module">
import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm?v=3.8.7'

const supabaseUrl =
'https://elmxwpwhyewgjlvoadtb.supabase.co';

const supabaseKey =
'sb_publishable_yUCov2V1dKGEc-rBwt6v2A_dBkHEiYd';

const supabase =
    createClient(
        supabaseUrl,
        supabaseKey
    );
    


const PAGE_SIZE = 10;
let logs = [];
let eventDateFilter = "";
let currentPage = 1;
let totalPages = 1;
let reloadTimeout;

async function loadLogs() {
    const filter = document.getElementById("actionFilter").value;
    const from = (currentPage - 1) * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;

    let query = supabase
        .from("logs")
        .select("*", { count: "exact" })
        .order("id", { ascending: false });

    if (filter) query = query.eq("action", filter);
    if (eventDateFilter) query = query.eq("event_date", eventDateFilter);

    const { data, error, count } = await query.range(from, to);

    if (error) {
        console.error(error);
        document.getElementById("tbody").innerHTML =
            `<tr><td colspan="10">Грешка при вчитување: ${error.message}</td></tr>`;
        return;
    }

    logs = data || [];
    totalPages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));

    if (currentPage > totalPages) {
        currentPage = totalPages;
        return loadLogs();
    }

    render();
}

function subscribeLogs() {

    supabase
        .channel('logs-realtime')
        .on('postgres_changes',
            {
                event: '*',
                schema: 'public',
                table: 'logs'
            },
            () => {

                clearTimeout(reloadTimeout);

                reloadTimeout = setTimeout(() => {
                    loadLogs();
                }, 300);
            }
        )
        .subscribe();
}
    
function formatDateTime(ts){

    if(!ts) return "";

    const d = new Date(ts);

    const pad = n => String(n).padStart(2,"0");

    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}


function render(){

    const tbody =
        document.getElementById("tbody");

    tbody.innerHTML = "";

    document.getElementById("pageInfo").textContent =
        `Страна ${currentPage} од ${totalPages}`;
    document.getElementById("prevPage").disabled = currentPage <= 1;
    document.getElementById("nextPage").disabled = currentPage >= totalPages;

    if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">Нема промени за избраните филтри.</td></tr>';
        return;
    }

    logs.forEach(l => {

        tbody.innerHTML += `
        <tr>
            <td>
                <span class="badge ${l.action}">
                    ${l.action}
                </span>
            </td>
            <td>${formatDateTime(l.created_at)}</td>
            <td>${l.event_date || ""}</td>
            <td>${l.event_time || ""}</td>
            <td>${l.room_name || ""}</td>
            <td>${l.subject_name || ""}</td>
            <td>${l.professor_name || ""}</td>
            <td>${l.type || ""}</td>
            <td>${l.groups_text || ""}</td>
            <td>${l.comment || ""}</td>
        </tr>`;
    });
}

document.getElementById("actionFilter")
.addEventListener("change", () => {
    currentPage = 1;
    loadLogs();
});

document.getElementById("eventDateFilter")
.addEventListener("change", (e) => {
    eventDateFilter = e.target.value;
    currentPage = 1;
    loadLogs();
});

document.getElementById("clearEventFilter")
.addEventListener("click", () => {
    eventDateFilter = "";
    document.getElementById("eventDateFilter").value = "";
    currentPage = 1;
    loadLogs();
});

document.getElementById("prevPage").addEventListener("click", () => {
    if (currentPage > 1) {
        currentPage--;
        loadLogs();
    }
});

document.getElementById("nextPage").addEventListener("click", () => {
    if (currentPage < totalPages) {
        currentPage++;
        loadLogs();
    }
});

loadLogs();
subscribeLogs();
</script>

</body>
</html>
