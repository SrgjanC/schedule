<html lang="mk">

<head>

    <meta charset="UTF-8">

    <title>Classroom Display</title>


    <!-- Supabase -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;
        }


        .container {

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            padding: 20px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .faculty-name {

            font-size: 18px;

            font-weight: 600;
        }


        .clock {

            font-size: 20px;

            font-weight: 600;
        }


        /* =========================================
           ROOM
        ========================================= */

        .room {

            text-align: center;

            margin-bottom: 25px;
        }


        .room-label {

            font-size: 16px;

            color: #6b7280;
        }


        .room-name {

            font-size: 32px;

            font-weight: 700;

            margin-top: 5px;
        }


        /* =========================================
           CURRENT CLASS
        ========================================= */

        .current-card {

            background: white;

            border-radius: 18px;

            padding: 30px 25px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);

            font-size: 15px;

            font-weight: 700;

            color: #6b7280;

            letter-spacing: 0.5px;

            margin-bottom: 15px;
        }


        .subject {

            font-size: 30px;

            font-weight: 700;

            line-height: 1.2;

            margin-bottom: 15px;
        }


        .type {

            font-size: 16px;

            color: #6b7280;

            margin-bottom: 20px;
        }


        .time {

            font-size: 22px;

        }


        .professor {

            margin-top: 15px;

            font-size: 17px;
        }


        .status {

            margin-top: 25px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-weight: 700;

            background: #dcfce7;

            color: #4b5563;

        /* =========================================
           NEXT CLASS

        .next-card {

            background: white;

            border-radius: 15px;

            padding: 20px;

                0 3px 15px rgba(0,0,0,0.06);
        }


        .next-time {

            font-size: 24px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .next-subject {

            font-size: 19px;

            font-weight: 600;
        }


        .next-professor {

            margin-top: 8px;

            color: #6b7280;

            font-size: 15px;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            text-align: center;

            padding: 60px 20px;

            color: #6b7280;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 20px;

            border-radius: 12px;

            margin-top: 20px;

            word-break: break-word;
        }


        /* =========================================
           MOBILE / TABLET
        ========================================= */

        @media (max-width: 600px) {

            .container {

                padding: 15px;
            }


            .subject {

                font-size: 25px;
            }


            .room-name {

                font-size: 28px;
            }


            .clock {

                font-size: 18px;
            }

        }


        /* =========================================
   TODAY SCHEDULE BUTTON
========================================= */

.today-button {

    width: 100%;

    margin-top: 20px;

    padding: 18px;

    border: none;

    border-radius: 14px;

    background: #1f2937;

    color: white;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    touch-action: manipulation;
}


.today-button:active {

    transform: scale(0.98);

}


/* =========================================
   TODAY SCHEDULE SCREEN
========================================= */

#todayScreen {

    display: none;
}


.today-header {

    text-align: center;

    margin-bottom: 20px;
}


.today-title {

}

/* =========================================

}


.schedule-item {

.schedule-item:last-child {

.schedule-time {

}


.schedule-subject {

}


.schedule-professor {

.schedule-type {

}


/* =========================================

========================================= */

.schedule-current {

}


/* =========================================

/* =========================================

========================================= */

.back-button {

    margin-top: 20px;

    border-radius: 14px;

}


/* =========================================
   COUNTDOWN
========================================= */

.countdown {

    margin-top: 12px;

    text-align: center;

    color: #166534;

}

<body>


<div class="container">


    <!-- =========================================
         HEADER

    <div class="header">

        <div class="faculty-name">

        </div>

    <!-- =========================================

        </div>

            class="room-name"

            --
        </div>

    </div>



    <!-- =========================================

    ========================================= -->

    <div id="mainScreen">

    <div id="content">

        <div class="loading">

            Се вчитува распоредот...

        </div>

    </div>

</div>


<!-- =========================================
     TODAY'S SCHEDULE SCREEN
========================================= -->

<div id="todayScreen">

    <div class="today-header">

        <div class="today-title">

            ДЕНЕШЕН РАСПОРЕД

        </div>

        <div

        </div>

        id="todaySchedule"

    </div>

    >

        ← НАЗАД

    </button>

</div>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://elmxwpwhyewgjlvoadtb.supabase.co';

const SUPABASE_ANON_KEY =
    'sb_publishable_yUCov2V1dKGEc-rBwt6v2A_dBkHEiYd';


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   CLASSROOM CONFIGURATION
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const roomCode =
    urlParams.get("room") || "01";


const classroomRoomIds = {

    "01": 1,
    "02": 2,
    "03": 3,
    "04": 4

};


const displayNames = {

    "01": "Предавална 1",
    "02": "Предавална 2",
    "03": "Предавална 3",
    "04": "Предавална 4"

};


const roomId =
    classroomRoomIds[roomCode];

const displayRoomName =
    displayNames[roomCode] ||
    roomCode;

document.getElementById("roomName")
    .textContent =
        displayRoomName;



/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    document.getElementById("clock")
        .textContent =
            `${hours}:${minutes}`;
}


updateClock();

setInterval(
    updateClock,
    1000
);



/* =========================================================
   TODAY
========================================================= */

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}



/* =========================================================
   TIME TO MINUTES
========================================================= */

function timeToMinutes(time) {

    if (!time) {
        return 0;
    }

    const cleanTime =
        time.substring(0, 5);

    const parts =
        cleanTime.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}



/* =========================================================
   ADD ONE HOUR
========================================================= */

function addHour(time) {

    if (!time) {
        return "";
    }

    const minutes =
        timeToMinutes(time);

    const newMinutes =
        minutes + 60;

    const hours =
        Math.floor(
            newMinutes / 60
        );

    const mins =
        newMinutes % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(mins).padStart(2, "0")
    );
}



/* =========================================================
   MERGE EVENTS
========================================================= */

function mergeEvents(events) {

    const merged = [];

    events.forEach(event => {

        const last =
            merged[merged.length - 1];

        if (

            last &&

            last.event_date ===
                event.event_date &&

            last.subjects?.id ===
                event.subjects?.id &&

            last.type ===
                event.type &&

            (last.rooms?.id || 0) ===
                (event.rooms?.id || 0) &&

            (last.professors?.id || 0) ===
                (event.professors?.id || 0) &&

            addHour(last.endTime) ===
                event.event_time.substring(0, 5)

        ) {

            last.endTime =
                event.event_time.substring(0, 5);

        }

        else {

            merged.push({

                ...event,

                startTime:
                    event.event_time
                        .substring(0, 5),

                endTime:
                    event.event_time
                        .substring(0, 5)

            });

        }

    });

    return merged;
}



/* =========================================================
   REAL CLASS END TIME
========================================================= */

function getClassEndTime(event) {

    return addHour(
        event.endTime
    );
}

function formatCountdown(totalMinutes) {

    if (totalMinutes <= 0) {
        return "";
    }


    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    if (hours > 0) {

        return `${hours}ч ${minutes}мин`;

    }


    return `${minutes} мин`;

}

    function getMinutesUntil(targetTime) {

    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    const targetMinutes =
        timeToMinutes(
            targetTime
        );


    return targetMinutes -
           currentMinutes;

}

/* =========================================================
   LOAD CLASSROOM
========================================================= */

async function loadClassroom() {

    const content =
        document.getElementById("content");


    try {

        content.innerHTML = `
            <div class="loading">
                Се вчитува распоредот...
            </div>
        `;


        const today =
            getToday();


        console.log("================================");

        console.log(
            "Classroom:",
            roomCode
        );

        

        console.log(
            "Today:",
            today
        );


        /* =========================================
           LOAD TODAY'S EVENTS
        ========================================= */

        const {
            data: events,
            error
        } = await supabaseClient

            .from("events")

            .select(`
                *,
                subjects (
                    id,
                    name,
                    semester,
                    institute,
                    programs (
                        id,
                        name
                    )
                ),
                professors (
                    id,
                    name
                ),
                rooms (
                    id,
                    name
                )
            `)

            .eq(
                "event_date",
                today
            );


        if (error) {
            throw error;
        }


        console.log(
            "All today's events:",
            events
        );
        console.log(
            "ROOM DEBUG:",
            events.map(event => ({
                event_id: event.id,
                room_id: event.room_id,
                rooms: event.rooms
            }))
        );


        /* =========================================
           FIND EVENTS FOR THIS ROOM
        ========================================= */

        const roomEvents =
            (events || []).filter(
                event =>
                    Number(event.room_id) ===
                    Number(roomId)
            );


        console.log(
            "Room ID:",
            roomId
        );

        console.log(
            "Room events:",
            roomEvents
        );


        /* =========================================
           SORT
        ========================================= */

        roomEvents.sort(
            (a, b) =>
                timeToMinutes(
                    a.event_time
                ) -
                timeToMinutes(
                    b.event_time
                )
        );


        /* =========================================
           MERGE
        ========================================= */

        const classBlocks =
            mergeEvents(
                roomEvents
            );


        console.log(
            "Merged class blocks:",
            classBlocks
        );


        /* =========================================
           DISPLAY
        ========================================= */

        displayCurrentAndNext(
            classBlocks
        );


        console.log(
            "================================"
        );


    }

    catch (error) {

        console.error(
            "CLASSROOM ERROR:",
            error
        );


        content.innerHTML = `

            <div class="error">

                Грешка при вчитување
                на распоредот.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* =========================================================
   DISPLAY CURRENT + NEXT
========================================================= */

function displayCurrentAndNext(events) {

    const content =
        document.getElementById(
            "content"
        );


    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    console.log(
        "Current time:",
        currentMinutes
    );


    let currentEvent =
        null;

    let nextEvent =
        null;


    /* =========================================
       FIND CURRENT AND NEXT
    ========================================= */

    for (
        let i = 0;
        i < events.length;
        i++
    ) {

        const event =
            events[i];


        const start =
            timeToMinutes(
                event.startTime
            );


        const end =
            timeToMinutes(
                getClassEndTime(event)
            );


        console.log(
            "Checking:",
            event.subjects?.name,
            event.startTime,
            getClassEndTime(event),
            "current:",
            currentMinutes >= start &&
            currentMinutes < end
        );


        /*
         * CURRENT
         */

        if (
            currentMinutes >= start &&
            currentMinutes < end
        ) {

            currentEvent =
                event;

            /*
             * Don't break yet.
             * We want to find the next class too.
             */

            continue;
        }


        /*
         * NEXT
         */

        if (
            start > currentMinutes &&
            !nextEvent
        ) {

            nextEvent =
                event;
        }

    }



    let html = "";



    /* =========================================
       CURRENT CLASS
    ========================================= */

    if (currentEvent) {

        const subject =
            currentEvent
                .subjects?.name ||
            "Непознат предмет";


        const professor =
            currentEvent
                .professors?.name ||
            "";


        const type =
            currentEvent.type ||
            "";


        const startTime =
            currentEvent.startTime;


        const endTime =
            getClassEndTime(
                currentEvent
            );

        const minutesRemaining =
            getMinutesUntil(
                endTime
            );

        html += `

            <div class="current-card">

                <div class="section-title">
                    ТЕКОВНА НАСТАВА
                </div>


                <div class="subject">
                    ${subject}
                </div>


                ${
                    type
                    ? `
                        <div class="type">
                            ${type}
                        </div>
                    `
                    : ""
                }


                <div class="time">

                    ${startTime}
                    –
                    ${endTime}

                </div>


                ${
                    professor
                    ? `
                        <div class="professor">

                            👨‍🏫
                            ${professor}

                        </div>
                    `
                    : ""
                }


                <div
                    class="status status-current"
                >

                    НАСТАВАТА Е ВО ТЕК

                </div>


                <div class="countdown">

                    Завршува за
                        ${formatCountdown(minutesRemaining)}

                </div>

            </div>

        `;

    }


    /* =========================================
       NO CURRENT CLASS
    ========================================= */

    else {

        html += `

            <div class="current-card">

                <div class="section-title">
                    МОМЕНТАЛНО
                </div>


                <div class="subject">
                    Нема настава
                </div>


                <div
                    class="status status-free"
                >

                    УЧИЛНИЦАТА Е СЛОБОДНА

                </div>

            </div>

        `;

    }



    /* =========================================
       NEXT CLASS
    ========================================= */

    if (nextEvent) {

        const subject =
            nextEvent
                .subjects?.name ||
            "Непознат предмет";


        const professor =
            nextEvent
                .professors?.name ||
            "";


        const startTime =
            nextEvent.startTime;


        const endTime =
            getClassEndTime(
                nextEvent
            );

        const minutesUntilNext =
            getMinutesUntil(
                nextEvent.startTime
            );

        html += `

            <div class="next-card">

                <div class="section-title">
                    СЛЕДНА НАСТАВА
                </div>


                <div class="next-time">

                    ${startTime}
                    –
                    ${endTime}

                </div>


                <div class="next-subject">

                    ${subject}

                </div>


                ${
                    professor
                    ? `
                        <div class="next-professor">

                            👨‍🏫
                            ${professor}

                        </div>
                    `
                    : ""
                }

<div class="next-countdown">

    Почнува за
    ${formatCountdown(minutesUntilNext)}

</div>

            </div>

        `;

    }


    /* =========================================
       NO MORE CLASSES
    ========================================= */

    else if (!currentEvent) {

        html += `

            <div class="next-card">

                <div class="section-title">
                    СЛЕДНА НАСТАВА
                </div>


                <div class="next-subject">

                    Нема повеќе настава
                    денес.

                </div>

            </div>

        `;

    }


   content.innerHTML =

    html +

    `
        <button
            class="today-button"
            onclick="showTodaySchedule()"
        >

            📅 РАСПОРЕД ЗА ДЕНЕС

        </button>
    `;

}



/* =========================================================
   INITIAL LOAD
========================================================= */

loadClassroom();



/* =========================================================
   REFRESH EVERY MINUTE
========================================================= */

setInterval(
    loadClassroom,
    60 * 1000
);


    /* =========================================================
   SHOW TODAY'S SCHEDULE
========================================================= */

function showTodaySchedule() {

    const mainScreen =
        document.getElementById(
            "mainScreen"
        );


    const todayScreen =
        document.getElementById(
            "todayScreen"
        );


    mainScreen.style.display =
        "none";


    todayScreen.style.display =
        "block";


    loadTodaySchedule();


    /*
     * Automatically return after 30 seconds.
     */

    clearTimeout(
        window.todayScreenTimeout
    );


    window.todayScreenTimeout =
        setTimeout(
            showMainScreen,
            30000
        );

}



/* =========================================================
   SHOW MAIN SCREEN
========================================================= */

function showMainScreen() {

    const mainScreen =
        document.getElementById(
            "mainScreen"
        );


    const todayScreen =
        document.getElementById(
            "todayScreen"
        );


    todayScreen.style.display =
        "none";


    mainScreen.style.display =
        "block";


    clearTimeout(
        window.todayScreenTimeout
    );

}



/* =========================================================
   LOAD TODAY'S SCHEDULE
========================================================= */

async function loadTodaySchedule() {

    const schedule =
        document.getElementById(
            "todaySchedule"
        );


    schedule.innerHTML = `

        <div class="loading">

            Се вчитува распоредот...

        </div>

    `;


    try {

        const today =
            getToday();


        const {
            data: events,
            error
        } = await supabaseClient

            .from("events")

            .select(`
                *,
                subjects (
                    id,
                    name,
                    semester,
                    institute,
                    programs (
                        id,
                        name
                    )
                ),
                professors (
                    id,
                    name
                ),
                rooms (
                    id,
                    name
                )
            `)

            .eq(
                "event_date",
                today
            )

            .eq(
                "room_id",
                roomId
            );


        if (error) {

            throw error;

        }


        const roomEvents =
            (events || []).sort(
                (a, b) =>
                    timeToMinutes(
                        a.event_time
                    ) -
                    timeToMinutes(
                        b.event_time
                    )
            );


        const classBlocks =
            mergeEvents(
                roomEvents
            );


        displayTodaySchedule(
            classBlocks
        );


    }

    catch (error) {

        console.error(
            "Today's schedule error:",
            error
        );


        schedule.innerHTML = `

            <div class="error">

                Грешка при вчитување
                на распоредот.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* =========================================================
   DISPLAY TODAY'S SCHEDULE
========================================================= */

function displayTodaySchedule(
    events
) {

    const schedule =
        document.getElementById(
            "todaySchedule"
        );


    const today =
        new Date();


    const currentMinutes =
        today.getHours() * 60 +
        today.getMinutes();


    /*
     * Date
     */

    document.getElementById(
        "todayDate"
    ).textContent =
        today.toLocaleDateString(
            "mk-MK",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        );


    if (!events.length) {

        schedule.innerHTML = `

            <div class="schedule-item">

                <div class="schedule-subject">

                    Нема настава
                    во оваа просторија
                    денес.

                </div>

            </div>

        `;

        return;

    }


    let html = "";


    for (
        let i = 0;
        i < events.length;
        i++
    ) {

        const event =
            events[i];


        const start =
            timeToMinutes(
                event.startTime
            );


        const end =
            timeToMinutes(
                getClassEndTime(
                    event
                )
            );


        /*
         * Add break if there is
         * a gap between classes.
         */

        if (i > 0) {

            const previous =
                events[i - 1];


            const previousEnd =
                timeToMinutes(
                    getClassEndTime(
                        previous
                    )
                );


            if (start > previousEnd) {

                html += `

                    <div class="schedule-break">

                        ── Пауза ──

                    </div>

                `;

            }

        }


        /*
         * Is this the current class?
         */

        const isCurrent =
            currentMinutes >= start &&
            currentMinutes < end;


        const subject =
            event.subjects?.name ||
            "Непознат предмет";


        const professor =
            event.professors?.name ||
            "";


        const type =
            event.type ||
            "";


        html += `

            <div
                class="
                    schedule-item
                    ${
                        isCurrent
                        ? "schedule-current"
                        : ""
                    }
                "
            >

                <div class="schedule-time">

                    ${event.startTime}
                    –
                    ${getClassEndTime(event)}

                </div>


                <div class="schedule-subject">

                    ${subject}

                </div>


                ${
                    professor
                    ? `

                        <div
                            class="schedule-professor"
                        >

                            👨‍🏫
                            ${professor}

                        </div>

                    `
                    : ""
                }


                ${
                    type
                    ? `

                        <div
                            class="schedule-type"
                        >

                            ${type}

                        </div>

                    `
                    : ""
                }


                ${
                    isCurrent
                    ? `

                        <div
                            class="schedule-type"
                        >

                            🟢 НАСТАВАТА Е ВО ТЕК

                        </div>

                    `
                    : ""
                }

            </div>

        `;

    }


    schedule.innerHTML =
        html;

}


    
</script>


</body>

</html>
