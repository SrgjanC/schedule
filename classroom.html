<script>

/* =========================================================

========================================================= */

const SUPABASE_URL =
    'https://elmxwpwhyewgjlvoadtb.supabase.co';

const SUPABASE_ANON_KEY =
    'sb_publishable_yUCov2V1dKGEc-rBwt6v2A_dBkHEiYd';


const supabaseClient =
    supabase.createClient(

    );


/* =========================================================
   CLASSROOM CONFIGURATION
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const roomCode =
    urlParams.get("room") || "01";


const classroomRoomIds = {

    "01": 1,
    "02": 2,
    "03": 3,
    "04": 4

};


const displayNames = {

    "01": "Предавална 1",
    "02": "Предавална 2",
    "03": "Предавална 3",
    "04": "Предавална 4"

};


const roomId =
    classroomRoomIds[roomCode];

const displayRoomName =
    displayNames[roomCode] ||
    roomCode;

document.getElementById("roomName")
    .textContent =
        displayRoomName;



/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    document.getElementById("clock")
        .textContent =
            `${hours}:${minutes}`;
}


updateClock();

setInterval(
    updateClock,
    1000
);



/* =========================================================
   TODAY
========================================================= */

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}



/* =========================================================
   TIME TO MINUTES
========================================================= */

function timeToMinutes(time) {

    if (!time) {
        return 0;
    }

    const cleanTime =
        time.substring(0, 5);

    const parts =
        cleanTime.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}



/* =========================================================
   ADD ONE HOUR
========================================================= */

function addHour(time) {

    if (!time) {
        return "";
    }

    const minutes =
        timeToMinutes(time);

    const newMinutes =
        minutes + 60;

    const hours =
        Math.floor(
            newMinutes / 60
        );

    const mins =
        newMinutes % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(mins).padStart(2, "0")
    );
}



/* =========================================================
   MERGE EVENTS
========================================================= */

/* =========================================================
   MERGE EVENTS
========================================================= */

function mergeEvents(events) {

    if (!events || !events.length) {
        return [];
    }

    /*
     * STEP 1
     * Sort by start time
     */
    const sorted = [...events].sort(
        (a, b) =>
            timeToMinutes(a.event_time) -
            timeToMinutes(b.event_time)
    );


    /*
     * STEP 2
     * Group all events having the same start time.
     *
     * Example:
     *
     * 12:00 Subject A
     * 12:00 Subject B
     * 12:00 Subject C
     *
     * becomes ONE block:
     *
     * 12:00–13:00
     * A
     * B
     * C
     */
    const timeBlocks = [];

    sorted.forEach(event => {

        const time =
            event.event_time.substring(0, 5);

        let block =
            timeBlocks.find(
                b => b.startTime === time
            );

        if (!block) {

            block = {
                startTime: time,
                endTime: addHour(time),
                event_date: event.event_date,
                events: []
            };

            timeBlocks.push(block);
        }

        block.events.push(event);

    });


    /*
     * STEP 3
     * Create unique subject / professor / type lists
     */
    timeBlocks.forEach(block => {

        const uniqueSubjects = [];
        const uniqueProfessors = [];
        const uniqueTypes = [];

        block.events.forEach(event => {

            const subjectId =
                event.subjects?.id ??
                event.subject_id ??
                event.subjects?.name;

            const subjectName =
                event.subjects?.name ||
                "Непознат предмет";


            /*
             * SUBJECT
             */
            if (
                !uniqueSubjects.some(
                    subject =>
                        String(subject.id) ===
                        String(subjectId)
                )
            ) {

                uniqueSubjects.push({
                    id: subjectId,
                    name: subjectName
                });

            }


            /*
             * PROFESSOR
             */
            const professorName =
                event.professors?.name;

            if (
                professorName &&
                !uniqueProfessors.includes(
                    professorName
                )
            ) {

                uniqueProfessors.push(
                    professorName
                );

            }


            /*
             * TYPE
             */
            const type =
                event.type;

            if (
                type &&
                !uniqueTypes.includes(type)
            ) {

                uniqueTypes.push(type);

            }

        });


        block.subjectsList =
            uniqueSubjects;

        block.professorsList =
            uniqueProfessors;

        block.typesList =
            uniqueTypes;

    });


    /*
     * STEP 4
     * MERGE CONSECUTIVE BLOCKS
     *
     * IMPORTANT:
     *
     * last.endTime is already the REAL end time.
     *
     * Therefore:
     *
     * 12:00–13:00
     * followed by
     * 13:00–14:00
     *
     * is checked with:
     *
     * last.endTime === block.startTime
     *
     * NOT addHour(last.endTime)
     */
    const merged = [];

    timeBlocks.forEach(block => {

        const last =
            merged[merged.length - 1];


        const currentSubjectIds =
            block.subjectsList
                .map(
                    subject =>
                        String(subject.id)
                )
                .sort();


        const lastSubjectIds =
            last
            ? last.subjectsList
                .map(
                    subject =>
                        String(subject.id)
                )
                .sort()
            : [];


        const sameSubjects =
            last &&
            JSON.stringify(
                lastSubjectIds
            ) ===
            JSON.stringify(
                currentSubjectIds
            );


        /*
         * SAME SUBJECT SET + CONSECUTIVE TIME
         */
        if (
            last &&
            last.event_date ===
                block.event_date &&

            last.endTime ===
                block.startTime &&

            sameSubjects
        ) {

            /*
             * Extend the existing block
             */
            last.endTime =
                block.endTime;


            /*
             * Add any new professors
             */
            block.professorsList
                .forEach(professor => {

                    if (
                        !last.professorsList
                            .includes(professor)
                    ) {

                        last.professorsList
                            .push(professor);

                    }

                });


            /*
             * Add any new teaching types
             */
            block.typesList
                .forEach(type => {

                    if (
                        !last.typesList
                            .includes(type)
                    ) {

                        last.typesList
                            .push(type);

                    }

                });

        }

        else {

            const firstEvent =
                block.events[0];


            merged.push({

                ...firstEvent,

                startTime:
                    block.startTime,

                endTime:
                    block.endTime,

                subjectsList:
                    block.subjectsList,

                professorsList:
                    block.professorsList,

                typesList:
                    block.typesList

            });

        }

    });


    return merged;

}

function getSubjectNames(event) {

    if (
        event.subjectsList &&
        event.subjectsList.length
    ) {
        return event.subjectsList.map(
            s => s.name
        );
    }

    return [
        event.subjects?.name ||
        "Непознат предмет"
    ];
}


function getProfessorNames(event) {

    if (
        event.professorsList &&
        event.professorsList.length
    ) {
        return event.professorsList;
    }

    if (event.professors?.name) {
        return [
            event.professors.name
        ];
    }

    return [];
}


function getTypeNames(event) {

    if (
        event.typesList &&
        event.typesList.length
    ) {
        return event.typesList;
    }

    if (event.type) {
        return [event.type];
    }

    return [];
}

/* =========================================================
   REAL CLASS END TIME
========================================================= */

function getClassEndTime(event) {

    if (event.endTime) {
        return event.endTime;
    }

    return addHour(
        event.startTime ||
        event.event_time.substring(0, 5)
    );

}

function formatCountdown(totalMinutes) {

    if (totalMinutes <= 0) {
        return "";
    }


    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    if (hours > 0) {

        return `${hours}ч ${minutes}мин`;

    }


    return `${minutes} мин`;

}

    function getMinutesUntil(targetTime) {

    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    const targetMinutes =
        timeToMinutes(
            targetTime
        );


    return targetMinutes -
           currentMinutes;

}

            );

            getClassEndTime(event),

            currentMinutes >= start &&
            currentMinutes < end

/* =========================================================
   DISPLAY TODAY'S SCHEDULE
========================================================= */

function displayTodaySchedule(
    events
) {

    const schedule =
        document.getElementById(
            "todaySchedule"
        );


    const today =
        new Date();


    const currentMinutes =
        today.getHours() * 60 +
        today.getMinutes();


    /*
     * Date
     */

    document.getElementById(
        "todayDate"
    ).textContent =
        today.toLocaleDateString(
            "mk-MK",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        );


    /*
     * NO EVENTS
     */

    if (!events.length) {

        schedule.innerHTML = `

            <div class="schedule-item">

                <div class="schedule-subject">

                    Нема настава
                    во оваа просторија
                    денес.

                </div>

            </div>

        `;

        return;

    }


    let html = "";


    /*
     * DISPLAY EACH COMBINED CLASS BLOCK
     */

    for (
        let i = 0;
        i < events.length;
        i++
    ) {

        const event =
            events[i];


        /*
         * START / END
         */

        const start =
            timeToMinutes(
                event.startTime
            );


        const end =
            timeToMinutes(
                event.endTime ||
                getClassEndTime(event)
            );


        /*
         * ADD BREAK
         *
         * Only add a pause if there is
         * a real gap between blocks.
         */

        if (i > 0) {

            const previous =
                events[i - 1];


            const previousEnd =
                timeToMinutes(
                    previous.endTime ||
                    getClassEndTime(previous)
                );


            if (start > previousEnd) {

                const freeHours =
                    (start - previousEnd) / 60;

                html += `

                    <div class="schedule-break">

                        — Предавалната е слободна
                            ${freeHours}
                            ${freeHours === 1 ? "час" : "часа"}
                        —

                    </div>

                `;

            }

        }


        /*
         * CURRENT CLASS
         */

        const isCurrent =
            currentMinutes >= start &&
            currentMinutes < end;


        /*
         * SUBJECTS
         *
         * For exam blocks there can be
         * several subjects.
         */

        const subjects =
            getSubjectNames(event);


        /*
         * PROFESSORS
         */

        const professors =
            getProfessorNames(event);


        /*
         * TYPES
         */

        const types =
            getTypeNames(event);


        /*
         * SUBJECT HTML
         */

        const subjectHtml =
            subjects
                .map(
                    subject => `
                        <div>
                            ${subject}
                        </div>
                    `
                )
                .join("");


        /*
         * PROFESSOR HTML
         */

        const professorHtml =
            professors.length
            ? `

                <div
                    class="schedule-professor"
                >

                    👨‍🏫
                    ${professors.join(" / ")}

                </div>

            `
            : "";


        /*
         * TYPE HTML
         */

        const typeHtml =
            types.length
            ? `

                <div
                    class="schedule-type"
                >

                    ${types.join(" / ")}

                </div>

            `
            : "";


        /*
         * FINAL SCHEDULE ITEM
         */

        html += `

            <div
                class="
                    schedule-item
                    ${
                        isCurrent
                        ? "schedule-current"
                        : ""
                    }
                "
            >

                <div class="schedule-time">

                    ${event.startTime}
                    –
                    ${
                        event.endTime ||
                        getClassEndTime(event)
                    }

                </div>


                <div class="schedule-subject">

                    ${subjectHtml}

                </div>


                ${professorHtml}


                ${typeHtml}


                ${
                    isCurrent
                    ? `

                        <div
                            class="schedule-type"
                        >

                            🟢 НАСТАВАТА Е ВО ТЕК

                        </div>

                    `
                    : ""
                }

            </div>

        `;

    }


    /*
     * DISPLAY
     */

    schedule.innerHTML =
        html;

}

        "professorSubtitle"
    ).textContent =
        displayRoomName;


    /*
     * Find the current class
     * from the same data we already
     * use for the main display.
     */

    loadProfessorCurrentClass();

}



/* =========================================================
   LOAD CURRENT CLASS FOR PROFESSOR
========================================================= */

async function loadProfessorCurrentClass() {

    try {

        const today =
            getToday();


        const {
            data: events,
            error
        } = await supabaseClient

            .from("events")

            .select(`
                *,
                subjects (
                    id,
                    name,
                    semester,
                    institute,
                    programs (
                        id,
                        name
                    )
                ),
                professors (
                    id,
                    name
                ),
                rooms (
                    id,
                    name
                )
            `)

            .eq(
                "event_date",
                today
            )

            .eq(
                "room_id",
                roomId
            );


        if (error) {

            throw error;

        }


        const roomEvents =
            (events || []).sort(
                (a, b) =>
                    timeToMinutes(
                        a.event_time
                    ) -
                    timeToMinutes(
                        b.event_time
                    )
            );


        const classBlocks =
            mergeEvents(
                roomEvents
            );


        const now =
            new Date();


        const currentMinutes =
            now.getHours() * 60 +
            now.getMinutes();


        let currentEvent =
            null;


        for (
            const event
            of classBlocks
        ) {

            const start =
                timeToMinutes(
                    event.startTime
                );


            const end =
                timeToMinutes(
                    getClassEndTime(
                        event
                    )
                );


            if (
                currentMinutes >= start &&
                currentMinutes < end
            ) {

                currentEvent =
                    event;

                break;

            }

        }


        if (!currentEvent) {

            document.getElementById(
                "professorSubject"
            ).textContent =
                "Нема тековна настава";


            document.getElementById(
                "professorTime"
            ).textContent =
                "Во моментов нема час за започнување.";


            document.querySelector(
                ".start-class-button"
            ).style.display =
                "none";


            return;

        }


        document.getElementById(
            "professorSubject"
        ).textContent =
            currentEvent
                .subjects?.name ||
            "Непознат предмет";


        document.getElementById(
            "professorTime"
        ).textContent =

            `${currentEvent.startTime} – ${
                getClassEndTime(
                    currentEvent
                )
            }`;


        document.querySelector(
            ".start-class-button"
        ).style.display =
            "block";


        /*
         * Store current event temporarily
         * in memory only.
         */

        window.currentProfessorEvent =
            currentEvent;


    }

    catch (error) {

        console.error(
            "Professor class error:",
            error
        );


        document.getElementById(
            "professorSubject"
        ).textContent =
            "Грешка";


        document.getElementById(
            "professorTime"
        ).textContent =
            error.message;

    }

}



/* =========================================================
   START CLASS
========================================================= */

async function startClass() {

    const event =
        window.currentProfessorEvent;

    if (!event) {
        return;
    }


    /*
     * Prevent starting the same class twice
     */
    if (event.started_at) {
        return;
    }


    /*
     * Exact start time
     */
    const startedAt =
        new Date().toISOString();


    /*
     * Save start time to Supabase
     *
     * IMPORTANT:
     * Only the FIRST event of a merged
     * multi-hour class is updated.
     */
    const {
        data,
        error
    } = await supabaseClient

        .from("events")

        .update({
            started_at: startedAt
        })

        .eq("id", event.id)

        .select()
        .single();


    /*
     * Database error
     */
    if (error) {

        console.error(
            "Start class error:",
            error
        );

        alert(
            "Грешка при започнување на наставата:\n\n" +
            error.message
        );

        return;
    }


    /*
     * Update local object immediately
     */
    event.started_at =
        data.started_at;


    /*
     * Display actual start time
     */
    const startDate =
        new Date(
            data.started_at
        );

    const hours =
        String(
            startDate.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            startDate.getMinutes()
        ).padStart(2, "0");


    /*
     * Professor screen
     */
    document.getElementById(
        "professorMenu"
    ).innerHTML = `

        <div class="professor-menu">

            <div class="class-started">

                ✓ НАСТАВАТА Е ЗАПОЧНАТА

            </div>


            <div
                class="professor-current-subject"
            >

                ${
                    event.subjectsList
                    ? event.subjectsList
                        .map(
                            s => s.name
                        )
                        .join("<br>")
                    : (
                        event.subjects?.name ||
                        "Непознат предмет"
                    )
                }

            </div>


            <div
                class="professor-current-time"
            >

                Започнато во
                ${hours}:${minutes}

            </div>

        </div>

    `;


    /*
     * Refresh main classroom display
     */
    loadClassroom();

}
    
</script>
