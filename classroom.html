<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classroom Display</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .faculty-name {
            font-size: 18px;
            font-weight: 600;
        }

        .clock {
            font-size: 20px;
            font-weight: 600;
        }

        /* ROOM */

        .room {
            text-align: center;
            margin-bottom: 25px;
        }

        .room-label {
            font-size: 16px;
            color: #6b7280;
        }

        .room-name {
            font-size: 32px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* CURRENT CLASS */

        .current-card {
            background: white;
            border-radius: 18px;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .subject {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .type {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .time {
            font-size: 22px;
            font-weight: 600;
        }

        .professor {
            margin-top: 15px;
            font-size: 17px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
        }

        .status-current {
            background: #dcfce7;
            color: #166534;
        }

        .status-free {
            background: #f3f4f6;
            color: #4b5563;
        }

        /* NEXT CLASS */

        .next-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .next-time {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .next-subject {
            font-size: 19px;
            font-weight: 600;
        }

        .next-professor {
            margin-top: 8px;
            color: #6b7280;
            font-size: 15px;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        /* MOBILE / TABLET */

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .subject {
                font-size: 25px;
            }

            .room-name {
                font-size: 28px;
            }

            .clock {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="faculty-name">
            Фармацевтски факултет
        </div>

        <div class="clock" id="clock">
            --:--
        </div>
    </div>

    <div class="room">
        <div class="room-label">
            УЧИЛНИЦА
        </div>

        <div class="room-name" id="roomName">
            --
        </div>
    </div>

    <div id="content">

        <div class="loading">
            Се вчитува распоредот...
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://elmxwpwhyewgjlvoadtb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yUCov2V1dKGEc-rBwt6v2A_dBkHEiYd";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   CLASSROOM
   ========================================================= */

/*
    The room is taken from the URL.

    Examples:

    classroom.html?room=01
    classroom.html?room=02
    classroom.html?room=03
    classroom.html?room=04
*/

const urlParams = new URLSearchParams(window.location.search);

const roomCode = urlParams.get("room") || "01";

document.getElementById("roomName").textContent = roomCode;


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${hours}:${minutes}`;
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   DATE
   ========================================================= */

function getToday() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================================================
   TIME TO MINUTES
   ========================================================= */

function timeToMinutes(time) {

    if (!time) return 0;

    const parts = time.substring(0, 5).split(":");

    return (
        parseInt(parts[0]) * 60 +
        parseInt(parts[1])
    );
}


/* =========================================================
   LOAD TODAY'S EVENTS
   ========================================================= */

async function loadClassroom() {

    const content = document.getElementById("content");

    try {

        const today = getToday();

        /*
         * IMPORTANT:
         *
         * For the first test we load the events for today
         * and then filter the classroom.
         *
         * We are NOT changing the database.
         */

        const { data, error } = await supabaseClient
            .from("events")
            .select(`
                id,
                event_date,
                event_time,
                type,
                subject_id,
                professor_id,
                room_id,

                subjects (
                    id,
                    name
                ),

                professor (
                    id,
                    name
                ),

                room (
                    id,
                    name
                )
            `)
            .eq("event_date", today);

        if (error) {
            throw error;
        }

        console.log("Today's events:", data);

        /*
         * Find the selected room.
         */

        const roomEvents = (data || []).filter(event => {

            if (!event.room) return false;

            return event.room.name === roomCode;
        });


        /*
         * Sort by start time.
         */

        roomEvents.sort((a, b) => {

            return timeToMinutes(a.event_time)
                 - timeToMinutes(b.event_time);

        });


        displayCurrentAndNext(roomEvents);

    } catch (error) {

        console.error(error);

        content.innerHTML = `
            <div class="error">
                Грешка при вчитување на распоредот.
                <br><br>
                ${error.message}
            </div>
        `;
    }
}


/* =========================================================
   DISPLAY CURRENT + NEXT
   ========================================================= */

function displayCurrentAndNext(events) {

    const content = document.getElementById("content");

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    /*
     * Find current class.
     *
     * For now we assume classes last until the
     * start of the next event.
     */

    let currentEvent = null;
    let nextEvent = null;


    for (let i = 0; i < events.length; i++) {

        const event = events[i];

        const start =
            timeToMinutes(event.event_time);

        const nextStart =
            i < events.length - 1
                ? timeToMinutes(events[i + 1].event_time)
                : 24 * 60;


        if (
            currentMinutes >= start &&
            currentMinutes < nextStart
        ) {

            currentEvent = event;

            if (i < events.length - 1) {
                nextEvent = events[i + 1];
            }

            break;
        }


        if (start > currentMinutes) {

            nextEvent = event;
            break;
        }
    }


    /*
     * Display
     */

    let html = "";


    if (currentEvent) {

        const subject =
            currentEvent.subjects?.name || "Непознат предмет";

        const professor =
            currentEvent.professor?.name || "";

        const type =
            currentEvent.type || "";


        html += `

            <div class="current-card">

                <div class="section-title">
                    ТЕКОВНА НАСТАВА
                </div>

                <div class="subject">
                    ${subject}
                </div>

                <div class="type">
                    ${type}
                </div>

                <div class="time">
                    ${currentEvent.event_time?.substring(0,5) || ""}
                </div>

                ${
                    professor
                    ? `
                        <div class="professor">
                            👨‍🏫 ${professor}
                        </div>
                    `
                    : ""
                }

                <div class="status status-current">
                    НАСТАВАТА Е ВО ТЕК
                </div>

            </div>
        `;

    } else {

        html += `

            <div class="current-card">

                <div class="section-title">
                    МОМЕНТАЛНО
                </div>

                <div class="subject">
                    Нема настава
                </div>

                <div class="status status-free">
                    УЧИЛНИЦАТА Е СЛОБОДНА
                </div>

            </div>
        `;
    }


    /*
     * NEXT CLASS
     */

    if (nextEvent) {

        const subject =
            nextEvent.subjects?.name || "Непознат предмет";

        const professor =
            nextEvent.professor?.name || "";

        html += `

            <div class="next-card">

                <div class="section-title">
                    СЛЕДНА НАСТАВА
                </div>

                <div class="next-time">
                    ${nextEvent.event_time?.substring(0,5) || ""}
                </div>

                <div class="next-subject">
                    ${subject}
                </div>

                ${
                    professor
                    ? `
                        <div class="next-professor">
                            👨‍🏫 ${professor}
                        </div>
                    `
                    : ""
                }

            </div>
        `;
    }


    content.innerHTML = html;
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadClassroom();


/*
 * Refresh the schedule every minute.
 */

setInterval(loadClassroom, 60 * 1000);

</script>

</body>
</html>
